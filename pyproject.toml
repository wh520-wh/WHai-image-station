[project]
name = "whai-image-station"
version = "1.1.0"
description = "轻量化桌面端图片生成工具"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.1",
    "httpx>=0.27.0,<1",
    "Pillow>=10.0.0,<13",
    "cryptography>=42.0.0,<49",
    "aiosqlite>=0.20.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pytest-cov>=5.0.0",
]
build = ["pyinstaller>=6.10.0,<7"]

[project.scripts]
whai-image-station = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
