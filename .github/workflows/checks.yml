name: Checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve Python interpreter
        run: |
          $pythonExecutable = (python -c "import sys; print(sys.executable)").Trim()
          "WHAI_PYTHON=$pythonExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install development and build dependencies
        run: '& $env:WHAI_PYTHON -m pip install -e ".[dev,build]"'
      - name: Report runtime versions
        run: '& $env:WHAI_PYTHON -c "import sys, PySide6; from PySide6.QtCore import qVersion; print(sys.version); print(''PySide6'', PySide6.__version__, ''Qt'', qVersion())"'
      - name: Lint
        run: '& $env:WHAI_PYTHON -m ruff check src build.py tools'
      - name: Check types with the installed interpreter
        run: '& $env:WHAI_PYTHON -m pyright --pythonpath $env:WHAI_PYTHON src'
      - name: Run offline tests
        run: '& $env:WHAI_PYTHON -m pytest -q'
      - name: Build portable Windows application
        run: '& $env:WHAI_PYTHON build.py'
      - name: Check packaged startup and shutdown
        run: |
          $checkDirectory = Join-Path $env:RUNNER_TEMP 'whai-package-smoke'
          $executable = (Resolve-Path 'dist/WHai-image-station/WHai-image-station.exe').Path
          $process = Start-Process -FilePath $executable -ArgumentList ('"--smoke-test={0}"' -f $checkDirectory) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id
            throw 'Packaged application did not exit within 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged application exited with code $($process.ExitCode)."
          }
          $report = Get-Content -LiteralPath (Join-Path $checkDirectory 'report.json') -Raw | ConvertFrom-Json
          $expectedPages = @('create', 'gallery', 'prompts', 'sources', 'tools', 'settings')
          if (-not $report.ready -or -not $report.icon_loaded -or -not $report.tools_checked -or $report.warnings.Count -ne 0 -or ($report.pages -join ',') -ne ($expectedPages -join ',')) {
            throw 'Packaged startup report failed readiness, icon, navigation, local tool or QML warning checks.'
          }
          $report | ConvertTo-Json -Depth 3
      - name: Save packaged startup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-startup-report
          path: ${{ runner.temp }}/whai-package-smoke/report.json
          if-no-files-found: ignore
          retention-days: 7
